<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People First</title>

  <script>
    const path = window.location.pathname;

    if (path.startsWith("/People-First/")) {
      const route = path.replace("/People-First", "");

      sessionStorage.setItem(
        "redirect",
        route + window.location.search
      );

      window.location.replace("/People-First/");
    }
  </script>
</head>

<body>
  <p>Loading People First...</p>
</body>
</html>
